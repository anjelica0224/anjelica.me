- navbot:
  id: NavBot
  excerpt: An AI chatbot-as-a-service. Any website owner can add a smart Q&A chatbot to their site in under 5 minutes, no ML knowledge, no backend changes. NavBot crawls your website, indexes the content into a vector database, and gives you a chatbot that answers only from your site's content with source links.
